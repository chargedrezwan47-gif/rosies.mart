const $=id=>document.getElementById(id);
let db=null,user=null,assets=null,products=[],cart=[],cur="৳",wa="",q="";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const list=s=>String(s||"").split(",").map(x=>x.trim()).filter(Boolean);
try{const t=localStorage.getItem("rm-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
$("tg").onclick=()=>{const r=document.documentElement,t=r.dataset.theme==="dark"?"light":"dark";r.dataset.theme=t;try{localStorage.setItem("rm-theme",t)}catch(e){}};
function show(v){["home","order","owner"].forEach(k=>$(k).classList.toggle("hide",k!==v));$("bar").classList.toggle("hide",v!=="home");window.scrollTo(0,0)}
$("q").oninput=e=>{q=e.target.value.toLowerCase();renderProducts()};

function renderProducts(){
 const f=products.filter(p=>(p.name||"").toLowerCase().includes(q));
 $("empty").classList.toggle("hide",f.length>0);
 $("plist").innerHTML=f.map((p,k)=>`<div class="card" style="--i:${k%2}" onclick="openP('${p.id}')"><img src="${esc(p.image)}" alt="${esc(p.name)}"></div>`).join("");observeCards();
 $("olist").innerHTML=products.map(p=>`<div class="line"><span>${esc(p.name)} — ${cur}${esc(p.price)}</span><button class="btn s" onclick="delp('${p.id}')">Delete</button></div>`).join("")||"<span class='mu'>None yet.</span>";
}
function openP(id){const p=products.find(x=>x.id===id);if(!p)return;
 $("sheet").innerHTML=`<img src="${esc(p.image)}" alt=""><b style="font-size:22px">${esc(p.name)}</b><div style="color:var(--ac);font-size:21px">${cur}${esc(p.price)}</div>
 ${p.colors?.length?`<label>Color<select id="mc">${p.colors.map(c=>`<option>${esc(c)}</option>`).join("")}</select></label>`:""}
 ${p.sizes?.length?`<label>Size<select id="ms">${p.sizes.map(c=>`<option>${esc(c)}</option>`).join("")}</select></label>`:""}
 <label>Quantity<input id="mq" type="number" min="1" value="1"></label>
 <button class="btn" onclick="add('${id}')">Add to order</button>`;
 $("ov").classList.add("on")}
function closeSheet(){$("ov").classList.remove("on")}
function add(id){const p=products.find(x=>x.id===id);
 cart.push({name:p.name,price:+p.price,color:$("mc")?.value||"",size:$("ms")?.value||"",qty:Math.max(1,parseInt($("mq").value)||1)});
 closeSheet();renderCart();show("order")}
function renderCart(){
 const t=cart.reduce((s,c)=>s+c.price*c.qty,0);
 $("bar").textContent=cart.length?`Order (${cart.length}) · ${cur}${t}`:"Order (0)";
 $("cart").innerHTML=cart.map((c,i)=>`<div class="line"><span>${esc(c.name)} ${[c.color,c.size].filter(Boolean).map(esc).join(" / ")} × ${c.qty}</span><span>${cur}${c.price*c.qty} <button class="btn s" onclick="cart.splice(${i},1);renderCart()">✕</button></span></div>`).join("")||"<span class='mu'>Your order is empty. Pick something from the shop.</span>";
 $("total").textContent=cur+t}
function delp(id){if(db&&confirm("Delete this product?"))db.doc("products/"+id).delete()}

$("place").onclick=async()=>{
 const n=$("n").value.trim(),p=$("p").value.trim(),a=$("a").value.trim(),m=$("msg");
 if(!cart.length||!n||!p||!a){m.innerHTML="<span style='color:#fca5a5'>Please add an item and fill in name, phone and address.</span>";return}
 const o={name:n,phone:p,address:a,items:cart,total:cart.reduce((s,c)=>s+c.price*c.qty,0),status:"new",at:Date.now()};
 try{
  try{if(db)await db.doc("orders/o"+Date.now()+Math.random().toString(36).slice(2,6)).set(o)}catch(e){}
  const txt="New order\nName: "+n+"\nPhone: "+p+"\nAddress: "+a+"\n\n"+cart.map(c=>"• "+c.name+" "+[c.color,c.size].filter(Boolean).join("/")+" × "+c.qty).join("\n")+"\n\nTotal: "+cur+o.total;
  const link=wa?"https://wa.me/"+wa.replace(/\D/g,"")+"?text="+encodeURIComponent(txt):"";
  cart=[];renderCart();
  if(link)setTimeout(()=>{location.href=link},900);
  m.innerHTML=link?"<div class='ok'>Opening WhatsApp… If it doesn't open, tap the button below.</div><p><a class='btn' style='display:inline-block;text-decoration:none' href='"+link+"' target='_blank' rel='noopener'>Send order on WhatsApp</a></p>":"<span style='color:#fca5a5'>The shop owner has not set a WhatsApp number yet.</span>";
 }catch(e){m.innerHTML="<span style='color:#fca5a5'>Sorry, the order could not be sent. Please try again.</span>"}
};
function renderOrders(docs){
 $("orders").innerHTML=docs.length?docs.map(d=>{const o=d.data();return `<div class="box" style="margin:0 0 10px"><b>${esc(o.name)}</b> · ${esc(o.phone)}<div>${esc(o.address)}</div>${(o.items||[]).map(c=>`<div class="mu">${esc(c.name)} ${[c.color,c.size].filter(Boolean).map(esc).join(" / ")} × ${c.qty}</div>`).join("")}<b>Total: ${cur}${esc(o.total)}</b><div class="mu">${new Date(o.at).toLocaleString()}</div></div>`}).join(""):"No orders yet."}

$("addp").onclick=async()=>{
 const m=$("pmsg");if(!$("pn").value||!$("pp").value){m.textContent="Add a name and price.";return}
 try{m.textContent="Saving…";let url="";const f=$("pi").files[0];
  if(f){if(!assets)throw new Error("Photo upload not available");url=(await assets.upload(f)).url}
  await db.doc("products/p"+Date.now()).set({name:$("pn").value,price:+$("pp").value,image:url,colors:list($("pc").value),sizes:list($("ps").value),order:Date.now()});
  ["pn","pp","pi","pc","ps"].forEach(k=>$(k).value="");m.textContent="Saved ✓";
 }catch(e){m.textContent="Could not save: "+(e.message||e.code)}};
$("sets").onclick=async()=>{try{await db.doc("settings/shop").set({name:$("sn").value,currency:$("sc").value,whatsapp:$("sw").value});$("sets").textContent="Saved ✓"}catch(e){$("sets").textContent="Failed"}};

const io="IntersectionObserver"in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.1}):null;
function observeCards(){document.querySelectorAll(".card:not(.in)").forEach(c=>io?io.observe(c):c.classList.add("in"))}
let ly=0,tk=false;
addEventListener("scroll",()=>{if(tk)return;tk=true;requestAnimationFrame(()=>{const y=scrollY;document.documentElement.style.setProperty("--py",(y*.25).toFixed(1));if(y>ly+4&&y>120)$("bar").classList.add("off");else if(y<ly-4)$("bar").classList.remove("off");ly=y;tk=false})},{passive:true});
renderCart();
(async()=>{
 try{db=await claude.use("db");user=await claude.use("user");assets=await claude.use("assets")}catch(e){}
 if(!db){products=SEED.slice().sort((x,y)=>(x.order||0)-(y.order||0));cur=SHOP.currency;wa=SHOP.whatsapp;document.title=SHOP.name;renderProducts();renderCart();return}
 db.collection("products").onSnapshot(s=>{products=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));renderProducts()});
 db.doc("settings/shop").onSnapshot(s=>{const d=s.data();if(d){cur=d.currency||"৳";wa=d.whatsapp||"";if(d.name)document.title=d.name;renderProducts();renderCart()}});
 if(user&&user.canEdit()){
  $("ownerLink").classList.remove("hide");
  db.collection("orders").orderBy("at","desc").onSnapshot(s=>renderOrders(s.docs));
 }
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
let sb=null,isAdmin=false;
if(SUPA.url&&SUPA.key&&window.supabase)sb=supabase.createClient(SUPA.url,SUPA.key);
function show(v){["home","order","owner","login"].forEach(k=>$(k).classList.toggle("hide",k!==v));$("bar").classList.toggle("hide",v!=="home");window.scrollTo(0,0)}
function adminClick(){show(isAdmin?"owner":"login");if(isAdmin)loadOrders()}
const toRow=r=>({id:r.id,name:r.name,price:r.price,image:r.image,colors:r.colors||[],sizes:r.sizes||[],order:r.sort||0});
async function loadAll(){
 const [p,s]=await Promise.all([sb.from("products").select("*").order("sort"),sb.from("settings").select("*").eq("id",1).maybeSingle()]);
 if(p.data)products=p.data.map(toRow);
 if(s.data){cur=s.data.currency||"৳";wa=s.data.whatsapp||"";if(s.data.shop_name)document.title=s.data.shop_name;$("sn").value=s.data.shop_name||"";$("sc").value=cur;$("sw").value=wa}
 renderProducts();renderCart()}
const _rp=renderProducts;
renderProducts=function(){_rp();if(!sb)return;$("olist").innerHTML=(products.length?"":"<button class='btn s' onclick='importSeed()'>Import the 6 sample products</button>")+products.map(p=>`<div class="line"><span>${esc(p.name)} — ${cur}${esc(p.price)}</span><span><button class="btn s" onclick="editp('${p.id}')">Edit</button> <button class="btn s" onclick="delp('${p.id}')">Delete</button></span></div>`).join("")};
async function importSeed(){const r=await sb.from("products").insert(SEED.map(p=>({name:p.name,price:p.price,image:p.image,colors:p.colors,sizes:p.sizes,sort:p.order})));if(r.error)alert(r.error.message);else loadAll()}
async function editp(id){const p=products.find(x=>x.id===id);
 const name=prompt("Name",p.name);if(name===null)return;const price=prompt("Price",p.price);if(price===null)return;
 const colors=prompt("Colors (comma separated)",(p.colors||[]).join(", "));if(colors===null)return;
 const sizes=prompt("Sizes (comma separated)",(p.sizes||[]).join(", "));if(sizes===null)return;
 const r=await sb.from("products").update({name,price:+price,colors:list(colors),sizes:list(sizes)}).eq("id",id);if(r.error)alert(r.error.message);else loadAll()}
async function delp(id){if(!confirm("Delete this product?"))return;const r=await sb.from("products").delete().eq("id",id);if(r.error)alert(r.error.message);else loadAll()}
async function loadOrders(){const r=await sb.from("orders").select("*").order("created_at",{ascending:false});if(r.error){$("orders").textContent="Could not load orders: "+r.error.message;return}renderOrders(r.data.map(o=>({data:()=>({...o,at:o.created_at})})))}
async function signOut(){await sb.auth.signOut();isAdmin=false;show("home")}
if(sb){
 db={doc:()=>({set:async o=>{const r=await sb.from("orders").insert({name:o.name,phone:o.phone,address:o.address,items:o.items,total:o.total});if(r.error)throw r.error}})};
 $("loginBtn").onclick=async()=>{const m=$("lmsg");m.textContent="Signing in…";const r=await sb.auth.signInWithPassword({email:$("le").value.trim(),password:$("lp").value});if(r.error){m.textContent="Login failed: "+r.error.message;return}$("lp").value="";m.textContent="";isAdmin=true;show("owner");loadOrders()};
 $("addp").onclick=async()=>{const m=$("pmsg");if(!$("pn").value||!$("pp").value){m.textContent="Add a name and price.";return}
  try{m.textContent="Saving…";let url="";const f=$("pi").files[0];
   if(f){const path=Date.now()+"-"+f.name.replace(/[^\w.]/g,"_");const u=await sb.storage.from("product-images").upload(path,f);if(u.error)throw u.error;url=sb.storage.from("product-images").getPublicUrl(path).data.publicUrl}
   const r=await sb.from("products").insert({name:$("pn").value,price:+$("pp").value,image:url,colors:list($("pc").value),sizes:list($("ps").value),sort:Date.now()});if(r.error)throw r.error;
   ["pn","pp","pi","pc","ps"].forEach(k=>$(k).value="");m.textContent="Saved ✓";loadAll()}catch(e){m.textContent="Could not save: "+(e.message||e)}};
 $("sets").onclick=async()=>{const r=await sb.from("settings").upsert({id:1,shop_name:$("sn").value,currency:$("sc").value,whatsapp:$("sw").value});$("sets").textContent=r.error?"Failed: "+r.error.message:"Saved ✓";loadAll()};
 sb.auth.getSession().then(r=>{if(r.data&&r.data.session)isAdmin=true});
 loadAll();
}else $("ownerLink").classList.add("hide");
</script></body></html>
